# # NOTE: Intel Mac with macOS prior to 15.5 requires setting vmType to qemu
# # https://github.com/lima-vm/lima/issues/3334
# vmType: qemu

# Do not require Lima NICs for systemd-networkd-wait-online: the first-boot
# rename to eth0 fails on 26.04 (LP: #2136392) and would block boot for 120s.
# Lima's cidata bootcmd renames the NIC and waits for it instead.
param:
  internal_netplanOptional: "true"

provision:
  # 1. Base packages
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y python3 python3-pip python3-venv systemd-zram-generator

  # 2. Seed dotfiles from the host, if `claudevm new` copied them in. Only
  #    ever placed once (skipped if the guest already has one), so later
  #    in-VM edits survive reboots instead of being overwritten each time.
  - mode: user
    script: |
      #!/bin/bash
      set -eu
      CONFIG=/mnt/claudevm-config

      if [ -f "$CONFIG/gitconfig" ] && [ ! -f ~/.gitconfig ]; then
        cp "$CONFIG/gitconfig" ~/.gitconfig
        # A host-wide credential.helper (e.g. macOS's osxkeychain) won't
        # exist on Linux; URL-scoped helpers the host config may set are
        # untouched.
        git config --global --unset credential.helper 2>/dev/null || true
      fi

      if [ -f "$CONFIG/vimrc" ] && [ ! -f ~/.vimrc ]; then
        cp "$CONFIG/vimrc" ~/.vimrc
      fi

  # 3. zram swap turns memory pressure into a slowdown instead of an OOM
  #    kill, and costs almost nothing while idle. A disk swapfile would grow
  #    the guest image for good and double-cache through the host. The
  #    generator brings the device up on later boots by itself; on the first
  #    boot it ran before the package existed, so start the unit here.
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      systemctl daemon-reload
      systemctl start systemd-zram-setup@zram0.service
